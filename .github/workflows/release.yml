# Release pipeline: every push to main (stable) or beta (pre-release)
#
#   quality gate ─► semantic release ─► container image ─► staging ─► production
#   (ci.yml)        version + tag +      GHCR, tagged by     Compose +   approval gate,
#                   CHANGELOG + notes    semantic version    smoke test  Render + Pages
#
# If no commit since the last tag is a feat, fix, perf or breaking change, no
# version is released and the later stages are skipped.
name: Release

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

# Never run two releases of the same branch at once, and never cancel one midway
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24
  HUSKY: 0

jobs:
  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Semantic release
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and tag, create the GitHub Release
      issues: write # comment "released in vX.Y.Z" on linked issues
      pull-requests: write # ... and on merged pull requests
    outputs:
      published: ${{ steps.result.outputs.published }}
      version: ${{ steps.result.outputs.version }}
      tag: ${{ steps.result.outputs.tag }}
      prerelease: ${{ steps.result.outputs.prerelease }}
      channel: ${{ steps.result.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history and all tags
          # A PAT/app token is only needed if branch protection blocks GITHUB_TOKEN pushes
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Verify integrity of installed packages
        run: npm audit signatures
      - name: Record existing tags
        run: git tag --list 'v*' | sort > "$RUNNER_TEMP/tags-before.txt"
      - name: Analyse commits → version, CHANGELOG, Git tag, GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@users.noreply.github.com
        run: npx semantic-release
      - name: Collect release outputs
        id: result
        run: |
          git tag --list 'v*' | sort > "$RUNNER_TEMP/tags-after.txt"
          TAG=$(comm -13 "$RUNNER_TEMP/tags-before.txt" "$RUNNER_TEMP/tags-after.txt" | tail -n1)
          if [ -z "$TAG" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "### No release" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`feat\`, \`fix\`, \`perf\` or breaking commits since the last tag, so nothing was released." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
            CHANNEL=$(echo "${VERSION#*-}" | cut -d. -f1)
          else
            PRERELEASE=false
            CHANNEL=latest
          fi
          {
            echo "published=true"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 🚀 Released $TAG"
            echo ""
            echo "- Channel: \`$CHANNEL\`"
            echo "- Release notes: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-image:
    name: Container image → GHCR
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Check out the release tag (includes the bumped version and CHANGELOG)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Build metadata
        id: vars
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags from the semantic version
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # 1.4.2 -> 1.4.2, 1.4, 1, latest      2.0.0-beta.3 -> 2.0.0-beta.3, beta
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ needs.release.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.release.outputs.channel }},enable=${{ needs.release.outputs.prerelease == 'true' }}
          labels: |
            org.opencontainers.image.title=semver-release-pipeline
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}
      - name: Build & push multi-arch image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.release.outputs.version }}
            GIT_SHA=${{ steps.vars.outputs.sha }}
            BUILD_DATE=${{ steps.vars.outputs.date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### 🐳 Published image"
            echo ""
            echo "Digest: \`$DIGEST\`"
            echo ""
            echo "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Staging
    needs: [release, publish-image]
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.version }}
      environment: staging
    secrets: inherit
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write

  deploy-production:
    name: Production
    # Pre-releases from the beta branch stop at staging
    needs: [release, deploy-staging]
    if: needs.release.outputs.prerelease == 'false'
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.version }}
      environment: production
    secrets: inherit
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write
