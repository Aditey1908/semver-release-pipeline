# Quality gate: runs on every pull request and is reused by release.yml
# before anything is released.
name: CI

on:
  pull_request:
    branches: [main, beta]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24
  HUSKY: 0

jobs:
  commitlint:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint commit messages in this PR
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Lint PR title (becomes the commit message on squash-merge)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --verbose

  test:
    name: Lint & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Unit + API tests with coverage thresholds
        run: npm run test:coverage
      - name: Coverage summary
        if: matrix.node == 24
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Test coverage", "", "| Metric | % | Covered |", "|---|---|---|",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.node == 24
        with:
          name: test-reports
          path: |
            coverage/
            reports/
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Fail on high-severity vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build application
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build dist/ (Vite bundle + build metadata)
        env:
          GIT_SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  docker:
    name: Docker build & container smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: semver-release-pipeline:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Start container with production hardening
        run: |
          docker run -d --name app -p 3000:3000 -e APP_ENV=ci \
            --read-only --tmpfs /tmp --security-opt no-new-privileges:true \
            semver-release-pipeline:ci
      - name: Smoke test the running container
        run: node scripts/smoke-test.js http://localhost:3000 --expect-version "$(node -p 'require("./package.json").version')"
      - name: Check Docker HEALTHCHECK status
        run: |
          for _ in $(seq 1 15); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          exit 1
      - name: Image size
        run: |
          docker image ls semver-release-pipeline:ci --format 'Image size: {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: always()
        run: docker logs app

  release-preview:
    name: Release preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so the latest release can be found
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Predict the version this change will release
        run: npm run release:preview
